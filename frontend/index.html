<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Sentinel · Safety Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: '#0a0e17',
              'navy-light': '#111927',
              'slate-dark': '#1a2332',
              'slate-mid': '#243044',
              'cyan-accent': '#00d4ff',
              'cyan-dim': 'rgba(0, 212, 255, 0.08)',
              'red-alert': '#ff1744',
              'orange-alert': '#ff9100',
              'yellow-alert': '#ffea00',
              'green-ok': '#00e676',
              'blue-info': '#2979ff',
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              glow: '0 0 30px rgba(0, 212, 255, 0.08)',
              'glow-strong': '0 0 50px rgba(0, 212, 255, 0.12)',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 4s linear infinite',
              'blink': 'blink 1.2s step-end infinite',
              'glow-pulse': 'glowPulse 2s ease-in-out infinite',
              'slide-up': 'slideUp 0.3s ease-out',
              'fade-in': 'fadeIn 0.25s ease-out',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(100%)' },
              },
              blink: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0 },
              },
              glowPulse: {
                '0%, 100%': { opacity: 0.6 },
                '50%': { opacity: 1 },
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(12px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0e17;
        color: #e8edf5;
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0e17;
      }
      ::-webkit-scrollbar-thumb {
        background: #243044;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00d4ff44;
      }
      .glass-panel {
        background: rgba(17, 25, 39, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.04);
      }
      .glass-panel-light {
        background: rgba(26, 35, 50, 0.7);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .cctv-frame {
        background: #060a12;
        border: 1px solid rgba(0, 212, 255, 0.12);
        box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      }
      .scan-line {
        background: linear-gradient(to bottom, transparent 0%, rgba(0, 212, 255, 0.02) 50%, transparent 100%);
        pointer-events: none;
        animation: scan 4s linear infinite;
      }
      .severity-critical {
        border-left: 3px solid #ff1744;
        background: rgba(255, 23, 68, 0.06);
      }
      .severity-high {
        border-left: 3px solid #ff9100;
        background: rgba(255, 145, 0, 0.05);
      }
      .severity-medium {
        border-left: 3px solid #ffea00;
        background: rgba(255, 234, 0, 0.04);
      }
      .severity-low {
        border-left: 3px solid #2979ff;
        background: rgba(41, 121, 255, 0.04);
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .status-dot.online {
        background: #00e676;
        box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        animation: glowPulse 2s ease-in-out infinite;
      }
      .status-dot.warning {
        background: #ffea00;
        box-shadow: 0 0 12px rgba(255, 234, 0, 0.3);
        animation: glowPulse 1.5s ease-in-out infinite;
      }
      .status-dot.offline {
        background: #ff1744;
        box-shadow: 0 0 12px rgba(255, 23, 68, 0.3);
      }
      .badge-glow {
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.08);
      }
      .transition-all {
        transition: all 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
      .map-pin {
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .map-pin:hover {
        transform: scale(1.25);
        filter: brightness(1.4);
      }
      .incident-card {
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .incident-card:hover {
        background: rgba(0, 212, 255, 0.04);
        border-color: rgba(0, 212, 255, 0.15);
      }
      .occupancy-bar {
        height: 4px;
        border-radius: 2px;
        background: #1a2332;
        overflow: hidden;
      }
      .occupancy-bar .fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.6s ease;
      }
      .blink-live {
        animation: blink 1.2s step-end infinite;
        color: #ff1744;
      }
      .nav-link {
        transition: all 0.15s ease;
        cursor: pointer;
      }
      .nav-link:hover {
        color: #00d4ff;
        background: rgba(0, 212, 255, 0.04);
      }
      .nav-link.active {
        color: #00d4ff;
        background: rgba(0, 212, 255, 0.08);
        border-right: 2px solid #00d4ff;
      }
      .btn-operator {
        transition: all 0.15s ease;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-operator:hover {
        transform: scale(1.02);
      }
      .btn-operator:active {
        transform: scale(0.97);
      }
      .toast-enter {
        animation: slideUp 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Use React from CDN for simplicity, but we'll write JSX with Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
      // ============================================================
      // 1. MOCK DATA & STATE
      // ============================================================

      const ZONES = [
        { id: 'main-gate', name: 'Main Gate', occupancy: 42, capacity: 60, lat: 40, lng: 50 },
        { id: 'gate-3', name: 'Gate 3', occupancy: 18, capacity: 40, lat: 55, lng: 42 },
        { id: 'robotics-lab', name: 'Robotics Lab', occupancy: 18, capacity: 30, lat: 65, lng: 65 },
        { id: 'cafeteria', name: 'Cafeteria', occupancy: 87, capacity: 100, lat: 30, lng: 70 },
        { id: 'library', name: 'Library', occupancy: 36, capacity: 120, lat: 45, lng: 85 },
        { id: 'parking', name: 'Parking', occupancy: 23, capacity: 80, lat: 20, lng: 30 },
        { id: 'academic-block', name: 'Academic Block', occupancy: 64, capacity: 90, lat: 50, lng: 25 },
      ]

      const CAMERAS = [
        { id: 'cam-01', name: 'Cam 1', zone: 'Main Gate', label: 'CAM-01 • MAIN GATE', status: 'online', severity: 'high' },
        { id: 'cam-02', name: 'Cam 2', zone: 'Gate 3', label: 'CAM-03 • GATE 3', status: 'online', severity: 'critical' },
        { id: 'cam-03', name: 'Cam 3', zone: 'Robotics Lab', label: 'CAM-07 • ROBOTICS LAB', status: 'online', severity: 'critical' },
        { id: 'cam-04', name: 'Cam 4', zone: 'Cafeteria', label: 'CAM-12 • CAFETERIA', status: 'online', severity: 'medium' },
        { id: 'cam-05', name: 'Cam 5', zone: 'Academic Block', label: 'CAM-15 • ACADEMIC BLOCK', status: 'warning', severity: 'high' },
      ]

      let incidentCounter = 100
      let eventCounter = 0

      const generateId = () => {
        incidentCounter += 1
        return `inc_${String(incidentCounter).padStart(4, '0')}`
      }

      const generateEventId = () => {
        eventCounter += 1
        return `evt_${String(eventCounter).padStart(4, '0')}`
      }

      const SEVERITIES = ['critical', 'high', 'medium', 'low']
      const SEVERITY_LABELS = { critical: 'CRITICAL', high: 'HIGH', medium: 'MEDIUM', low: 'LOW' }
      const SEVERITY_COLORS = {
        critical: '#ff1744',
        high: '#ff9100',
        medium: '#ffea00',
        low: '#2979ff',
      }
      const INCIDENT_TYPES = [
        'unattended_baggage',
        'restricted_intrusion',
        'crowd_density',
        'fire_smoke',
        'unusual_occupancy',
      ]
      const INCIDENT_LABELS = {
        unattended_baggage: 'Unattended Baggage',
        restricted_intrusion: 'Restricted Zone Intrusion',
        crowd_density: 'Crowd Density Threshold',
        fire_smoke: 'Fire / Smoke Detected',
        unusual_occupancy: 'Unusual Occupancy',
      }

      const mockIncidents = []

      // Seed initial incidents
      const seedIncidents = () => {
        const baseTime = Date.now() - 120000
        const templates = [
          {
            type: 'unattended_baggage',
            zone: 'Gate 3',
            tracked_object_id: 47,
            dwell_time_seconds: 32,
            detection_confidence: 0.89,
            severity: 'high',
            status: 'unacknowledged',
            correlated_incident_ids: ['inc_0088'],
            reasoning_summary:
              'Bag #47 remained stationary for 32 seconds with no person detected nearby. A related movement event involving the same tracked subject occurred shortly afterward, increasing the likelihood of a coordinated incident.',
            recommended_action: 'dispatch_security',
            notification_draft:
              'Security team requested at Gate 3. Unattended baggage associated with recent movement event detected.',
          },
          {
            type: 'restricted_intrusion',
            zone: 'Robotics Lab',
            tracked_object_id: 23,
            dwell_time_seconds: null,
            detection_confidence: 0.94,
            severity: 'critical',
            status: 'unacknowledged',
            correlated_incident_ids: [],
            reasoning_summary:
              'Person #23 entered the Robotics Lab restricted zone via the north access point. This area is designated as high-security and requires immediate attention.',
            recommended_action: 'dispatch_security',
            notification_draft: 'Unauthorized access detected in Robotics Lab. Security team dispatched.',
          },
          {
            type: 'crowd_density',
            zone: 'Main Gate',
            tracked_object_id: null,
            dwell_time_seconds: null,
            detection_confidence: 0.78,
            severity: 'medium',
            status: 'acknowledged',
            correlated_incident_ids: [],
            reasoning_summary:
              'Main Gate occupancy reached 42 people, exceeding the 60% threshold. Crowd flow patterns suggest a surge in foot traffic.',
            recommended_action: 'monitor',
            notification_draft: 'Main Gate experiencing elevated foot traffic. Continue monitoring.',
          },
          {
            type: 'unusual_occupancy',
            zone: 'Cafeteria',
            tracked_object_id: null,
            dwell_time_seconds: null,
            detection_confidence: 0.62,
            severity: 'low',
            status: 'unacknowledged',
            correlated_incident_ids: [],
            reasoning_summary:
              'Cafeteria occupancy is 87 people, which is within normal range but trending upward. No immediate action required.',
            recommended_action: 'monitor',
            notification_draft: 'Cafeteria occupancy trending upward. Routine monitoring advised.',
          },
          {
            type: 'fire_smoke',
            zone: 'Academic Block',
            tracked_object_id: null,
            dwell_time_seconds: null,
            detection_confidence: 0.91,
            severity: 'critical',
            status: 'unacknowledged',
            correlated_incident_ids: [],
            reasoning_summary:
              'Fire/smoke detection triggered in Academic Block corridor C. Immediate evacuation and emergency response required.',
            recommended_action: 'evacuate',
            notification_draft: '⚠️ FIRE ALERT: Academic Block. Evacuate immediately. Emergency services notified.',
          },
        ]

        templates.forEach((t, i) => {
          const ts = baseTime + i * 8000
          mockIncidents.push({
            incident_id: generateId(),
            ...t,
            timestamp: new Date(ts).toISOString(),
            created_at: new Date(ts).toISOString(),
            updated_at: new Date(ts + 2000).toISOString(),
            ai_processed: true,
            ai_processed_at: new Date(ts + 3000).toISOString(),
            human_override: null,
            false_positive: false,
          })
        })

        // Add one acknowledged incident with override
        mockIncidents[0].status = 'acknowledged'
        mockIncidents[0].human_override = { severity: 'high', by: 'operator', at: new Date(Date.now() - 30000).toISOString() }
      }

      seedIncidents()

      // ============================================================
      // 2. MOCK REALTIME ENGINE
      // ============================================================

      const mockRealtime = {
        listeners: [],
        timer: null,
        running: false,

        subscribe(callback) {
          this.listeners.push(callback)
          if (!this.running) this.start()
          return () => {
            this.listeners = this.listeners.filter((l) => l !== callback)
            if (this.listeners.length === 0) this.stop()
          }
        },

        start() {
          if (this.running) return
          this.running = true
          this.timer = setInterval(() => {
            this.emit()
          }, 4000)
        },

        stop() {
          this.running = false
          if (this.timer) {
            clearInterval(this.timer)
            this.timer = null
          }
        },

        emit() {
          const event = this.generateEvent()
          this.listeners.forEach((cb) => cb(event))
        },

        generateEvent() {
          const types = ['incident_new', 'incident_update', 'occupancy_update', 'activity_log']
          const type = types[Math.floor(Math.random() * types.length)]

          if (type === 'incident_new') {
            const zone = ZONES[Math.floor(Math.random() * ZONES.length)]
            const typeIdx = Math.floor(Math.random() * INCIDENT_TYPES.length)
            const typeKey = INCIDENT_TYPES[typeIdx]
            const sevIdx = Math.floor(Math.random() * 3) + 1 // low, medium, high
            const severity = ['low', 'medium', 'high', 'critical'][sevIdx]
            const trackedId = Math.floor(Math.random() * 80) + 10

            const incident = {
              incident_id: generateId(),
              type: typeKey,
              zone: zone.name,
              tracked_object_id: trackedId,
              dwell_time_seconds: typeKey === 'unattended_baggage' ? Math.floor(Math.random() * 45) + 10 : null,
              detection_confidence: 0.75 + Math.random() * 0.2,
              severity: severity,
              status: 'unacknowledged',
              correlated_incident_ids: [],
              reasoning_summary:
                `Automated detection flagged ${INCIDENT_LABELS[typeKey].toLowerCase()} in ${zone.name}. ` +
                `Confidence ${Math.round((0.75 + Math.random() * 0.2) * 100)}%.`,
              recommended_action: severity === 'critical' || severity === 'high' ? 'dispatch_security' : 'monitor',
              notification_draft: `${INCIDENT_LABELS[typeKey]} detected at ${zone.name}. ${
                severity === 'critical' ? 'Immediate attention required.' : 'Monitor situation.'
              }`,
              timestamp: new Date().toISOString(),
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
              ai_processed: true,
              ai_processed_at: new Date(Date.now() + 1000).toISOString(),
              human_override: null,
              false_positive: false,
            }

            mockIncidents.unshift(incident)

            return {
              type: 'incident_new',
              data: incident,
              log: `${new Date().toLocaleTimeString()} · ${INCIDENT_LABELS[typeKey]} detected at ${zone.name}`,
            }
          }

          if (type === 'incident_update') {
            const unack = mockIncidents.filter((i) => i.status === 'unacknowledged')
            if (unack.length === 0) {
              return { type: 'activity_log', log: `${new Date().toLocaleTimeString()} · System check: all clear` }
            }
            const inc = unack[Math.floor(Math.random() * unack.length)]
            const oldSev = inc.severity
            const sevIdx = ['low', 'medium', 'high', 'critical'].indexOf(oldSev)
            if (sevIdx < 2) {
              const newSev = ['low', 'medium', 'high', 'critical'][sevIdx + 1]
              inc.severity = newSev
              inc.updated_at = new Date().toISOString()
              inc.recommended_action = newSev === 'critical' || newSev === 'high' ? 'dispatch_security' : 'monitor'
              return {
                type: 'incident_update',
                data: inc,
                log: `${new Date().toLocaleTimeString()} · ${INCIDENT_LABELS[inc.type]} severity escalated from ${oldSev.toUpperCase()} → ${newSev.toUpperCase()}`,
              }
            }
            return { type: 'activity_log', log: `${new Date().toLocaleTimeString()} · No updates available` }
          }

          if (type === 'occupancy_update') {
            const zone = ZONES[Math.floor(Math.random() * ZONES.length)]
            const delta = Math.floor(Math.random() * 10) - 4
            zone.occupancy = Math.max(0, Math.min(zone.capacity, zone.occupancy + delta))
            return {
              type: 'occupancy_update',
              data: { zoneId: zone.id, occupancy: zone.occupancy, capacity: zone.capacity },
              log: `${new Date().toLocaleTimeString()} · ${zone.name} occupancy ${delta >= 0 ? '+' : ''}${delta} → ${zone.occupancy}`,
            }
          }

          return {
            type: 'activity_log',
            log: `${new Date().toLocaleTimeString()} · System heartbeat: all services operational`,
          }
        },
      }

      // ============================================================
      // 3. HELPER FUNCTIONS
      // ============================================================

      const formatTime = (iso) => {
        const d = new Date(iso)
        return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
      }

      const formatDate = (iso) => {
        const d = new Date(iso)
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      }

      const getSeverityColor = (sev) => SEVERITY_COLORS[sev] || '#888'
      const getSeverityLabel = (sev) => SEVERITY_LABELS[sev] || sev.toUpperCase()

      const getZoneById = (id) => ZONES.find((z) => z.id === id)

      const getOccupancyPercent = (zone) => Math.round((zone.occupancy / zone.capacity) * 100)

      const getOccupancyColor = (zone) => {
        const pct = getOccupancyPercent(zone)
        if (pct >= 85) return '#ff1744'
        if (pct >= 70) return '#ff9100'
        if (pct >= 50) return '#ffea00'
        return '#00e676'
      }

      const getIncidentIcon = (type) => {
        const map = {
          unattended_baggage: 'luggage',
          restricted_intrusion: 'shield-alert',
          crowd_density: 'users',
          fire_smoke: 'flame',
          unusual_occupancy: 'building-2',
        }
        return map[type] || 'alert-circle'
      }

      // ============================================================
      // 4. REACT COMPONENTS
      // ============================================================

      const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React

      // --- Context ---
      const AppContext = createContext()

      const useApp = () => useContext(AppContext)

      // --- Toast system ---
      const ToastContext = createContext()
      const useToast = () => useContext(ToastContext)

      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([])

        const addToast = useCallback((message, type = 'info', duration = 4000) => {
          const id = Date.now() + Math.random()
          setToasts((prev) => [...prev, { id, message, type, duration }])
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id))
          }, duration)
        }, [])

        return (
          <ToastContext.Provider value={{ addToast }}>
            {children}
            <div className="fixed bottom-6 right-6 z-50 space-y-2 max-w-sm">
              {toasts.map((toast) => (
                <div
                  key={toast.id}
                  className="glass-panel px-4 py-3 rounded-lg border border-white/5 shadow-glow toast-enter text-sm flex items-center gap-2"
                >
                  <span
                    className="w-1.5 h-1.5 rounded-full flex-shrink-0"
                    style={{
                      background:
                        toast.type === 'success' ? '#00e676' :
                        toast.type === 'error' ? '#ff1744' :
                        toast.type === 'warning' ? '#ff9100' : '#00d4ff',
                    }}
                  />
                  <span>{toast.message}</span>
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        )
      }

      // --- Icon helper ---
      // Lucide's createElement() expects an IconNode, not the icon name string.
      // The old code passed `name` directly, which caused:
      // "TypeError: d.forEach is not a function".
      const Icon = ({ name, size = 18, className = '', ...props }) => {
        const [Svg, setSvg] = useState(null)

        useEffect(() => {
          if (!window.lucide || !window.lucide.icons) return

          const pascalName = String(name || '')
            .split('-')
            .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
            .join('')

          const iconNode = window.lucide.icons[pascalName]
          if (!iconNode || !window.lucide.createElement) return

          try {
            const icon = window.lucide.createElement(iconNode)
            if (!icon) return

            icon.setAttribute('width', String(size))
            icon.setAttribute('height', String(size))
            if (className) icon.setAttribute('class', className)

            Object.entries(props).forEach(([k, v]) => {
              if (v !== undefined && v !== null && typeof v !== 'object') {
                icon.setAttribute(k, String(v))
              }
            })

            setSvg(icon.outerHTML)
          } catch (error) {
            console.warn(`Unable to render Lucide icon "${name}"`, error)
            setSvg(null)
          }
        }, [name, size, className, JSON.stringify(props)])

        if (!Svg) {
          return (
            <span
              className={`inline-flex items-center justify-center ${className}`}
              style={{ width: size, height: size }}
              aria-hidden="true"
            />
          )
        }

        return <span dangerouslySetInnerHTML={{ __html: Svg }} />
      }

      // --- Stat Card ---
      const StatCard = ({ label, value, icon, trend, trendLabel, color = 'cyan-accent', subValue }) => {
        return (
          <div className="glass-panel rounded-xl p-4 border border-white/5 hover:border-white/10 transition-all hover-lift">
            <div className="flex items-start justify-between">
              <div>
                <div className="text-xs text-gray-400 uppercase tracking-wider font-medium">{label}</div>
                <div className="text-2xl font-bold mt-1 tracking-tight" style={{ color: color || '#fff' }}>
                  {value}
                </div>
                {subValue && <div className="text-xs text-gray-500 mt-0.5">{subValue}</div>}
              </div>
              <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center" style={{ color: color || '#888' }}>
                <Icon name={icon} size={20} />
              </div>
            </div>
            {trend && (
              <div className="flex items-center gap-1.5 mt-2 text-xs">
                <span className={trend > 0 ? 'text-green-400' : 'text-red-400'}>
                  {trend > 0 ? '↑' : '↓'} {Math.abs(trend)}%
                </span>
                <span className="text-gray-500">{trendLabel || 'vs prior'}</span>
              </div>
            )}
          </div>
        )
      }

      // --- CCTV Feed ---

        const [chain, setChain] = useState([])
        const [verifying, setVerifying] = useState(false)

        const buildChain = useCallback(async () => {
          setVerifying(true)
          const source = incidents.slice().reverse().slice(-12)
          let prevHash = '0'.repeat(64)
          const blocks = []
          for (let i = 0; i < source.length; i++) {
            const inc = source[i]
            const payload = `${prevHash}|${inc.incident_id}|${inc.type}|${inc.severity}|${inc.timestamp}`
            try {
              const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload))
              const hashHex = Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('')
              blocks.push({ index: i, incident_id: inc.incident_id, type: inc.type, timestamp: inc.timestamp, prevHash, hash: hashHex })
              prevHash = hashHex
            } catch (e) {
              // crypto.subtle unavailable (non-secure context) - skip gracefully
            }
          }
          setChain(blocks)
          setVerifying(false)
        }, [incidents])

        useEffect(() => { buildChain() }, [incidents.length])

        return { chain, verifying, revalidate: buildChain }

      // --- Incidents workspace ---
      const IncidentWorkspace = ({ incidents, updateIncident, addLog, focusIncidentId, clearFocus }) => {
        const toast = useToast()
        const [selectedId, setSelectedId] = useState(null)
        const [query, setQuery] = useState('')
        const [severity, setSeverity] = useState('all')

        // Jump straight to an incident when navigated here from another page
        useEffect(() => {
          if (focusIncidentId) {
            setSelectedId(focusIncidentId)
            clearFocus && clearFocus()
          }
        }, [focusIncidentId])

        // Always read the live incident from state, never a stale snapshot —
        // this is what makes Override Severity / False Positive actually show up.
        const selected = selectedId ? incidents.find((i) => i.incident_id === selectedId) : null

        const shown = incidents.filter(
          (i) =>
            (severity === 'all' || i.severity === severity) &&
            `${i.incident_id} ${i.zone} ${INCIDENT_LABELS[i.type]}`.toLowerCase().includes(query.toLowerCase())
        )

        const handleAcknowledge = (inc) => {
          updateIncident(inc.incident_id, { status: 'acknowledged' })
          addLog(`Operator acknowledged ${inc.incident_id}`)
          toast.addToast(`${inc.incident_id} acknowledged`, 'success')
        }

        const handleOverride = (inc) => {
          const sevs = ['low', 'medium', 'high', 'critical']
          const idx = sevs.indexOf(inc.severity)
          const newSev = sevs[(idx + 1) % sevs.length]
          updateIncident(inc.incident_id, {
            severity: newSev,
            human_override: { severity: newSev, by: 'operator', at: new Date().toISOString() },
          })
          addLog(`Severity override for ${inc.incident_id} → ${newSev.toUpperCase()}`)
          toast.addToast(`Severity overridden to ${getSeverityLabel(newSev)}`, 'warning')
        }

        const handleFalsePositive = (inc) => {
          updateIncident(inc.incident_id, { false_positive: true, status: 'dismissed' })
          addLog(`${inc.incident_id} marked as false positive`)
          toast.addToast(`${inc.incident_id} marked as false positive`, 'info')
        }

        const handleEscalate = (inc) => {
          updateIncident(inc.incident_id, { severity: 'critical', recommended_action: 'emergency_response' })
          addLog(`${inc.incident_id} escalated to emergency response`)
          toast.addToast(`${inc.incident_id} escalated — emergency response notified`, 'error')
        }

        const handleResolve = (inc) => {
          updateIncident(inc.incident_id, { status: 'resolved' })
          addLog(`${inc.incident_id} resolved`)
          toast.addToast(`${inc.incident_id} resolved`, 'success')
        }

        if (selected) {
          return (
            <div className="animate-fade-in">
              <button
                onClick={() => setSelectedId(null)}
                className="mb-4 flex items-center gap-1.5 text-sm text-gray-400 hover:text-cyan-accent transition-colors"
              >
                <Icon name="arrow-left" size={15} /> Back to incidents
              </button>
              <IncidentDetail
                incident={selected}
                onClose={() => setSelectedId(null)}
                onAcknowledge={handleAcknowledge}
                onOverride={handleOverride}
                onFalsePositive={handleFalsePositive}
                onEscalate={handleEscalate}
              />
              <div className="mt-3">
                <button
                  onClick={() => handleResolve(selected)}
                  disabled={selected.status === 'resolved'}
                  className="btn-operator px-4 py-2 rounded-lg bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  <Icon name="check-check" size={14} className="inline mr-1.5" />
                  {selected.status === 'resolved' ? 'Resolved' : 'Resolve incident'}
                </button>
              </div>
            </div>
          )
        }

        return (
          <div className="animate-fade-in">
            <div className="flex flex-wrap gap-3 justify-between mb-5">
              <div>
                <h2 className="text-xl font-bold text-white">Incidents</h2>
                <p className="text-sm text-gray-400">Select an incident to review the AI's analysis and take action.</p>
              </div>
              <div className="flex gap-2">
                <div className="relative">
                  <Icon name="search" size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-500" />
                  <input
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search incidents"
                    className="pl-8 pr-3 py-2 text-sm rounded-lg bg-black/30 border border-white/10 text-white outline-none focus:border-cyan-accent transition-colors w-44"

                <select
                  value={severity}
                  onChange={(e) => setSeverity(e.target.value)}
                  className="px-3 py-2 text-sm rounded-lg bg-black/30 border border-white/10 text-white outline-none focus:border-cyan-accent transition-colors"
                >
                  <option value="all">All severities</option>
                  {SEVERITIES.map((s) => (
                    <option key={s} value={s}>
                      {getSeverityLabel(s)}
                    </option>
                  ))}
                </select>
              </div>
            </div>
            <div className="space-y-2 max-w-3xl">
              {shown.length ? (
                shown.map((i) => <IncidentCard key={i.incident_id} incident={i} onClick={() => setSelectedId(i.incident_id)} />)

                  value={range}
                  onChange={(e) => setRange(e.target.value)}
                  className="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-cyan-accent transition-colors"
                >
                  {['7 Days', '30 Days', 'All Time'].map((x) => (
                    <option key={x}>{x}</option>
                  ))}
                </select>
                <select
                  value={camera}
                  onChange={(e) => setCamera(e.target.value)}
                  className="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-cyan-accent transition-colors"
                >
                  <option>All cameras</option>
                  {[...new Set(incidents.map((i) => i.zone))].map((x) => (
                    <option key={x}>{x}</option>
                  ))}
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
              <StatCard label="Total Incidents" value={filtered.length} color="#00d4ff" icon="list" />
              <StatCard
                label="High Severity"
                value={filtered.filter((i) => i.severity === 'high' || i.severity === 'critical').length}
                color="#ff9100"
                icon="flame"
              />
              <StatCard label="Medium Severity" value={filtered.filter((i) => i.severity === 'medium').length} color="#ffea00" icon="alert-circle" />
              <StatCard label="Low Severity" value={filtered.filter((i) => i.severity === 'low').length} color="#2979ff" icon="info" />
              <StatCard label="Resolved" value={filtered.filter((i) => i.status === 'resolved').length} color="#00e676" icon="check-circle" />
            </div>
            <div className="grid md:grid-cols-2 gap-5">
              <div className="glass-panel rounded-xl p-5 border border-white/5">
                <h3 className="text-sm font-semibold mb-4">Severity distribution · {range}</h3>
                {counts.map(({ s, n }) => (
                  <div key={s} className="mb-3">
                    <div className="flex justify-between text-xs mb-1">
                      <span style={{ color: getSeverityColor(s) }}>{getSeverityLabel(s)}</span>
                      <span className="text-gray-400">{n}</span>
                    </div>
                    <div className="h-2 rounded-full bg-white/5 overflow-hidden">
                      <div
                        className="h-full rounded-full transition-all duration-700 ease-out"
                        style={{ width: `${filtered.length ? (n / filtered.length) * 100 : 0}%`, background: getSeverityColor(s) }}
                      />
                    </div>
                  </div>
                ))}
              </div>
              <div className="glass-panel rounded-xl p-5 border border-white/5">
                <h3 className="text-sm font-semibold mb-4">Response health</h3>
                {[
                  ['Resolved', filtered.filter((i) => i.status === 'resolved').length, 'check-check', '#00e676'],
                  ['Acknowledged', filtered.filter((i) => i.status === 'acknowledged').length, 'check', '#00d4ff'],
                  ['Unacknowledged', filtered.filter((i) => i.status === 'unacknowledged').length, 'clock', '#ff9100'],
                ].map(([l, n, icon, color]) => (
                  <div key={l} className="flex justify-between items-center border-b border-white/5 py-3 text-sm last:border-b-0">
                    <span className="text-gray-400 flex items-center gap-2">
                      <span style={{ color }}>
                        <Icon name={icon} size={14} />
                      </span>
                      {l}
                    </span>
                    <span className="font-bold" style={{ color }}>
                      {n}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )
      }

      // --- Cameras workspace ---
      const CameraWorkspace = ({ cameras, incidents, onAdd, compact = false }) => {
        const [selected, setSelected] = useState(null)

        if (selected) {
          const cam = cameras.find((c) => c.id === selected.id) || selected
          return <CameraDetail camera={cam} incidents={incidents} onBack={() => setSelected(null)} backLabel="Back to cameras" />
        }

        return (
          <div className="animate-fade-in">
            {compact ? (
              <div className="flex justify-between items-center mb-3">
                <div>
                  <div className="text-xs text-gray-400 uppercase tracking-wider font-semibold">Camera Overview</div>
                  <div className="text-sm text-gray-300">{cameras.length} cameras connected</div>
                </div>
                <button onClick={onAdd} className="text-xs text-cyan-accent hover:text-white transition-colors flex items-center gap-1">
                  <Icon name="plus" size={13} /> Add Camera
                </button>
              </div>
            ) : (
              <div className="flex justify-between items-center mb-4">
                <div>
                  <h2 className="text-xl font-bold text-white">Cameras</h2>
                  <p className="text-sm text-gray-400">{cameras.length} connected camera feeds</p>
                </div>
                <button onClick={onAdd} className="btn-operator px-3 py-2 rounded-lg bg-cyan-accent text-navy font-semibold text-sm flex items-center gap-1.5">
                  <Icon name="plus" size={15} /> Add Camera
                </button>
              </div>
            )}
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {cameras.map((c) => (
                <CameraCard key={c.id} camera={c} onClick={setSelected} />
              ))}
              <AddCameraCard onClick={onAdd} />
            </div>
          </div>
        )
      }

      // --- Overview workspace ---
      const OverviewWorkspace = ({ cameras, incidents, logs, onAdd, goIncidents }) => {
        const totalAlerts = incidents.filter((i) => i.status === 'unacknowledged').length
        const criticalCount = incidents.filter((i) => i.severity === 'critical' && i.status === 'unacknowledged').length
        const peopleDetected = ZONES.reduce((sum, z) => sum + z.occupancy, 0)
        const aiDecisions = incidents.filter((i) => i.ai_processed).length

        return (
          <div className="animate-fade-in">
            <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">Campus Safety Command Center</h1>
                <p className="text-sm text-gray-400 mt-0.5">Real-time AI-assisted monitoring across campus zones</p>
              </div>
              <div className="flex items-center gap-2 text-xs text-green-400 glass-panel-light px-3 py-1.5 rounded-full border border-white/5">
                <span className="status-dot online" /> All systems operational
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">
              <StatCard
                label="Active Alerts"
                value={totalAlerts}
                icon="bell"
                color={totalAlerts > 0 ? '#ff9100' : '#00e676'}
                trend={totalAlerts > 0 ? 12 : -5}
                trendLabel="vs prior"
              />
              <StatCard
                label="Critical Incidents"
                value={criticalCount}
                icon="alert-triangle"
                color={criticalCount > 0 ? '#ff1744' : '#00e676'}
                trend={criticalCount > 0 ? 8 : 0}
                trendLabel="unacknowledged"
              />
              <StatCard label="People Detected" value={peopleDetected} icon="users" color="#00d4ff" trend={3} trendLabel="vs prior" />
              <StatCard label="Monitored Zones" value={`${ZONES.length} / ${ZONES.length}`} icon="map-pin" color="#00e676" subValue="All online" />
              <StatCard label="AI Decisions" value={aiDecisions} icon="brain" color="#2979ff" trend={5} trendLabel="vs prior" />
            </div>

            <div className="mb-6">
              <CameraWorkspace cameras={cameras} incidents={incidents} onAdd={onAdd} compact />
            </div>

            <div className="glass-panel rounded-xl p-4 border border-white/5 mb-6">
              <div className="flex justify-between items-center mb-3">
                <div>
                  <div className="text-xs text-gray-400 uppercase tracking-wider font-semibold">Incidents</div>
                  <div className="text-sm text-gray-300">Latest live detections</div>
                </div>
                <button
                  onClick={() => goIncidents()}
                  className="text-xs text-cyan-accent hover:text-white transition-colors flex items-center gap-1"
                >
                  View all incidents <Icon name="arrow-right" size={12} />
                </button>
              </div>
              <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                {incidents.slice(0, 5).map((i) => (
                  <IncidentCard key={i.incident_id} incident={i} onClick={() => goIncidents(i.incident_id)} />
                ))}
              </div>
            </div>

            <div className="mb-6">
              <HashChainPanel incidents={incidents} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <OccupancyPanel />
              <div className="lg:col-span-2">
                <TrendChart />
              </div>
              <SystemHealth />
              <div className="lg:col-span-2">
                <ActivityFeed logs={logs} />
              </div>
            </div>
          </div>
        )
      }

      // --- App shell (nav + routing), rendered inside ToastProvider/AppContext ---
      const AppShell = ({
        page,
        setPage,
        cameras,
        incidents,
        logs,
        addOpen,
        setAddOpen,
        addCamera,
        updateIncident,
        addLog,
        logout,
        focusIncidentId,
        setFocusIncidentId,
      }) => {
        const toast = useToast()
        const unacknowledged = incidents.filter((i) => i.status === 'unacknowledged').length

        const goIncidents = (incidentId) => {
          if (incidentId) setFocusIncidentId(incidentId)
          setPage('incidents')
        }

        const handleAddCamera = (c) => {
          const camera = addCamera(c)
          toast.addToast(`Camera "${camera.name}" added to ${camera.zone}`, 'success')
        }

        const navItems = [
          ['overview', 'Overview', 'layout-dashboard'],
          ['cameras', 'Cameras', 'cctv'],
          ['incidents', 'Incidents', 'alert-triangle'],
          ['analytics', 'Analytics', 'chart-bar'],
          ['tampering', 'Tampering Logs', 'shield-alert'],
          ['health', 'System Health', 'activity'],
        ]

        const content =
          page === 'overview' ? (
            <OverviewWorkspace cameras={cameras} incidents={incidents} logs={logs} onAdd={() => setAddOpen(true)} goIncidents={goIncidents} />
          ) : page === 'cameras' ? (
            <CameraWorkspace cameras={cameras} incidents={incidents} onAdd={() => setAddOpen(true)} />
          ) : page === 'incidents' ? (
            <IncidentWorkspace
              incidents={incidents}
              updateIncident={updateIncident}
              addLog={addLog}
              focusIncidentId={focusIncidentId}
              clearFocus={() => setFocusIncidentId(null)}
            />
          ) : page === 'analytics' ? (
            <AnalyticsWorkspace incidents={incidents} />
          ) : page === 'tampering' ? (
            <TamperingLogsPage incidents={incidents} logs={logs} />
          ) : (
            <div className="max-w-md">
              <SystemHealth />
            </div>
          )

        return (
          <div className="min-h-screen bg-navy">
            <header className="h-16 px-5 flex items-center justify-between border-b border-white/5 bg-navy/90 backdrop-blur-sm fixed top-0 left-0 right-0 z-40">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-cyan-accent/10 border border-cyan-accent/20 flex items-center justify-center">
                  <Icon name="shield" size={20} className="text-cyan-accent" />
                </div>
                <div>
                  <div className="text-base font-bold tracking-tight text-white leading-tight">
                    OMNIGUARD <span className="text-xs text-cyan-accent">SAFETY INTELLIGENCE</span>
                  </div>
                  <div className="text-[10px] font-medium text-cyan-accent/70 tracking-wider uppercase hidden sm:block">
                    Agentic Campus Safety Intelligence
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() =>
                    toast.addToast(
                      unacknowledged ? `${unacknowledged} active alert${unacknowledged === 1 ? '' : 's'} need review` : 'All clear — no active alerts',
                      unacknowledged ? 'warning' : 'success'
                    )
                  }
                  className="relative w-9 h-9 rounded-lg hover:bg-white/5 flex items-center justify-center text-gray-400 hover:text-cyan-accent transition-colors"
                  aria-label="Alerts"
                >
                  <Icon name="bell" size={18} />
                  {unacknowledged > 0 && <span className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-alert animate-pulse-fast" />}
                </button>
                <button
                  onClick={() => setPage('health')}
                  className="w-9 h-9 rounded-lg hover:bg-white/5 flex items-center justify-center text-gray-400 hover:text-cyan-accent transition-colors"
                  aria-label="System settings"
                >
                  <Icon name="settings" size={18} />
                </button>
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-accent/20 to-cyan-accent/5 border border-cyan-accent/20 flex items-center justify-center text-xs font-bold text-cyan-accent">
                  OP
                </div>
              </div>
            </header>

            <aside className="w-56 h-screen fixed left-0 top-16 bottom-0 bg-navy/95 border-r border-white/5 z-30 flex flex-col">
              <nav className="flex-1 pt-4 px-3 space-y-0.5">
                {navItems.map(([id, label, icon]) => (
                  <div
                    key={id}
                    className={`nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${
                      page === id ? 'active text-cyan-accent bg-cyan-dim border-r-2 border-cyan-accent' : 'text-gray-400 hover:text-white'
                    }`}
                    onClick={() => setPage(id)}
                  >
                    <Icon name={icon} size={18} />
                    <span>{label}</span>
                    {id === 'incidents' && unacknowledged > 0 && (
                      <span className="ml-auto text-[10px] font-bold bg-red-alert/20 text-red-alert px-1.5 py-0.5 rounded-full">
                        {unacknowledged}
                      </span>
                    )}
                  </div>
                ))}
              </nav>
              <div className="p-3 border-t border-white/5 space-y-3">
                <div className="glass-panel-light rounded-lg p-3">
                  <div className="text-xs text-gray-400 uppercase tracking-wider mb-1">Operator Mode</div>
                  <div className="flex items-center gap-2 text-sm font-medium text-green-400">
                    <span className="status-dot online" />
                    Human Oversight: ENABLED
                  </div>
                </div>
                <button
                  onClick={logout}
                  className="w-full text-left px-1 text-sm text-gray-400 hover:text-red-400 transition-colors flex items-center gap-2"
                >
                  <Icon name="log-out" size={15} /> Logout
                </button>
              </div>
            </aside>

            <main className="ml-56 pt-20 p-6">{content}</main>

            {addOpen && <AddCameraModal onClose={() => setAddOpen(false)} onSave={handleAddCamera} />}
          </div>
        )
      }

      // --- Root app: auth state + global data, then hands off to AppShell/OnboardingScreen ---
      const OmniGuardApp = () => {
        const [mode, setMode] = useState(localStorage.getItem('omniguard-mode') || '')
        const [page, setPage] = useState('overview')
        const [incidents, setIncidents] = useState(mockIncidents)
        const [cameras, setCameras] = useState(CAMERAS)
        const [logs, setLogs] = useState(() =>
          mockIncidents.slice(0, 5).map((i) => ({ time: formatTime(i.timestamp), message: `${INCIDENT_LABELS[i.type]} detected at ${i.zone} (${i.incident_id})` }))
        )
        const [addOpen, setAddOpen] = useState(false)
        const [focusIncidentId, setFocusIncidentId] = useState(null)

        const addLog = (message) => setLogs((p) => [{ time: new Date().toLocaleTimeString(), message }, ...p].slice(0, 50))
        const login = (value) => {
          localStorage.setItem('omniguard-mode', value)
          setMode(value)
        }
        const logout = () => {
          localStorage.removeItem('omniguard-mode')
          setMode('')
        }
        const updateIncident = (id, patch) =>
          setIncidents((p) => p.map((i) => (i.incident_id === id ? { ...i, ...patch, updated_at: new Date().toISOString() } : i)))
        const addCamera = (c) => {
          const camera = {
            id: `cam-${String(cameras.length + 1).padStart(2, '0')}`,
            name: c.name,
            zone: c.zone,
            label: `${c.name.toUpperCase()} · ${c.zone.toUpperCase()}`,
            status: 'online',
            severity: 'none',
          }
          setCameras((p) => [...p, camera])
          setAddOpen(false)
          addLog(`Camera ${camera.name} added in ${camera.zone}`)
          return camera
        }

        useEffect(() => {
          const unsubscribe = mockRealtime.subscribe((event) => {
            if (event.type === 'incident_new' && event.data) setIncidents((prev) => [event.data, ...prev])
            if (event.type === 'incident_update' && event.data)
              setIncidents((prev) => prev.map((i) => (i.incident_id === event.data.incident_id ? { ...i, ...event.data } : i)))
            if (event.type === 'occupancy_update') setIncidents((prev) => [...prev])
            if (event.log) addLog(event.log)
          })
          return () => unsubscribe()
        }, [])

        if (!mode) return <LoginScreen onLogin={login} />

        const contextValue = {
          incidents,
          logs,
          addLog,
          acknowledgeIncident: (id) => updateIncident(id, { status: 'acknowledged' }),
          overrideSeverity: (id, severity) =>
            updateIncident(id, { severity, human_override: { severity, by: 'operator', at: new Date().toISOString() } }),
          falsePositive: (id) => updateIncident(id, { false_positive: true, status: 'dismissed' }),
          escalateIncident: (id) => updateIncident(id, { severity: 'critical', recommended_action: 'emergency_response' }),
        }

        return (
          <AppContext.Provider value={contextValue}>
            <ToastProvider>
              {mode === 'new' ? (
                <OnboardingScreen
                  cameras={cameras}
                  addOpen={addOpen}
                  setAddOpen={setAddOpen}
                  addCamera={addCamera}
                  logout={logout}
                  onFinish={() => login('admin')}
                />
              ) : (
                <AppShell
                  page={page}
                  setPage={setPage}
                  cameras={cameras}
                  incidents={incidents}
                  logs={logs}
                  addOpen={addOpen}
                  setAddOpen={setAddOpen}
                  addCamera={addCamera}
                  updateIncident={updateIncident}
                  addLog={addLog}
                  logout={logout}
                  focusIncidentId={focusIncidentId}
                  setFocusIncidentId={setFocusIncidentId}
                />
              )}
            </ToastProvider>
          </AppContext.Provider>
        )
      }

      // ============================================================
      // 6. RENDER
      // ============================================================

      const root = ReactDOM.createRoot(document.getElementById('root'))
      root.render(<OmniGuardApp />)

      // Initialize Lucide icons
      //if (window.lucide) {
      //  window.lucide.createIcons()
     // }
    </script>
  </body>
</html>
